  - id: ecsly.deterministic_structural_changes
    spec: "Structural changes (spawn/despawn/add/remove) are deferred through command queues and applied at explicit flushes."
    invariant: "Replaying the same command sequence from an equal starting world produces bit-identical worlds — same entity generations, archetype membership, and iteration order."
    provenance: accepted_concept
  - id: ecsly.no_flutter_in_core
    spec: "The ecsly core package has zero Flutter dependencies and runs on any Dart host."
    invariant: "core_packages/ecsly/pubspec.yaml declares no flutter dependency; no lib/src file imports package:flutter."
    provenance: accepted_concept
  - id: ecsly.low_gc_hot_path
    spec: "Hot simulation loops avoid per-entity allocation via typed SoA extension components and column storage."
    invariant: "When enforceSoAForHotSchedules is enabled, hot-schedule access to non-SoA components is rejected rather than silently falling back to object storage."
    provenance: accepted_concept
  - id: ecsly.three_lane_api
    spec: "API lanes: hot path (schedules/columns), warm path (commands/resources/prepared queries), cold app path (actions/drafts/UI helpers in ecsly_app)."
    invariant: "No cold-app-lane API (drafts, domain-id projections, route lookups) appears in core_packages/ecsly public exports."
    provenance: accepted_concept
