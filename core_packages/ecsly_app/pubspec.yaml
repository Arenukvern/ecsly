version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  ecsly: ^0.1.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  xsoulspace_lints: ^0.1.2
