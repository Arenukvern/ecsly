name: ecsly_context
description: "Beat-graph context core for memory tools: append-only beats, provenance-carrying summaries and decompositions, budgeted wake projections with named absences."
version: 0.1.0-dev.1
homepage: https://github.com/arenukvern/ecsly/plugins/ecsly_context

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  # Product-agnostic framework primitives (deterministic hashing first —
  # ADR 0071 amends this plugin's original zero-dep ruling). Still pure
  # Dart: no Flutter, no I/O beyond the plugin's own store.
  ecsly: ^0.0.1-dev.13

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  xsoulspace_lints: ^0.1.2
