name: ecs_camera_plugin
description: Low-level camera system plugin for ECS (position, velocity,
  targets, smoothing, constraints, shake) - NO input dependency
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace
dependencies:
  ecsly:
  ecs_camera_core:
  ecs_spatial_core:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  xsoulspace_lints: ^0.1.2

flutter:
  uses-material-design: true
