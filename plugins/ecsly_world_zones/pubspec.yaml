name: ecsly_world_zones
description: >-
  Zone-travel adapter for ecsly worlds (ADR 0003): the mesh sync pulse as
  an ordinary ecsly system driven by the game's OWN scheduler, and
  interest policies (zone census, spatial) over the world-layer contract.
version: 0.1.0-dev.1
homepage: https://github.com/arenukvern/ecsly/plugins/ecsly_world_zones

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  meta: ^1.19.0
  ecsly: ^0.0.1-dev.13
  universal_storage_world: ^0.1.0-dev.1

# Bootstrap constraint: the world layer is not published to pub.dev yet,
# so this workspace resolves it from the sibling storage_problem repo via
# a local path override — the same shape as ecsly_world_sync's kernel
# override. Remove once published; the declared dependency above is the
# long-term contract.
dependency_overrides:
  universal_storage_world:
    path: ../../../storage_problem/dart_flutter_packages/pkgs/universal_storage_world

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  xsoulspace_lints: ^0.1.2
