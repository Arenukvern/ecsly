version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace
dependencies:
  ecsly:
  ecs_spatial_core:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  ecs_camera_control_plugin:
  ecs_camera_plugin:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  xsoulspace_lints: ^0.1.2

flutter:
  uses-material-design: true
