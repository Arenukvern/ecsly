name: ecsly_world_sync
description: >-
  World-sync plugin for ecsly worlds: converts world event-channel events and
  component deltas into convergence-kernel ops, and folds remote ops back into
  a world-state projection. Consumes the convergence kernel (ADR 0011) and the
  shared anti-entropy session core (ADR 0004); merge strategy and compaction
  policy are chosen here, never hand-rolled.
version: 0.1.0-dev.1
homepage: https://github.com/arenukvern/ecsly/plugins/ecsly_world_sync

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_storage_convergence: ^0.1.0-dev.1
  universal_storage_convergence_session: ^0.1.0-dev.1

# Bootstrap constraint: the convergence kernel and the anti-entropy session
# core (ADR 0004) are not published to pub.dev yet, so this workspace resolves
# them — plus the session core's own `universal_storage_world` dependency (for
# InterestSelection) and `universal_storage_mesh_transport` (the bridge
# plugin's radio) — from the sibling storage_problem repo via local path
# overrides. Pub workspaces share one resolution and reject the same override
# declared twice: `universal_storage_world` is therefore overridden once, in
# `plugins/ecsly_world_zones/pubspec.yaml`, and the other three here — all
# four removed together at publish time. The declared dependencies above are
# the long-term contract.
dependency_overrides:
  universal_storage_convergence:
    path: ../../../storage_problem/dart_flutter_packages/pkgs/universal_storage_convergence
  universal_storage_convergence_session:
    path: ../../../storage_problem/dart_flutter_packages/pkgs/universal_storage_convergence_session
  universal_storage_mesh_transport:
    path: ../../../storage_problem/dart_flutter_packages/pkgs/universal_storage_mesh_transport

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  xsoulspace_lints: ^0.1.2
