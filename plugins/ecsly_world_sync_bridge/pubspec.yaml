name: ecsly_world_sync_bridge
description: >-
  Live World-to-delta bridge for ecsly worlds: diffs ecsly_serialization
  world captures into ecsly_world_sync ComponentDeltas at flush boundaries,
  and schedules anti-entropy sessions over the foundation's mesh transport —
  the convergence session core owns the wire, the delta planning, and the
  compaction policy (ADR 0004). Merge semantics stay in the convergence
  kernel.
version: 0.1.0-dev.1
homepage: https://github.com/arenukvern/ecsly/plugins/ecsly_world_sync_bridge
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  ecsly:
    path: ../../core_packages/ecsly
  ecsly_serialization:
    path: ../ecsly_serialization
  ecsly_world_sync:
    path: ../ecsly_world_sync
  meta: ^1.19.0
  universal_storage_convergence_session: ^0.1.0-dev.1
  universal_storage_mesh_transport: ^0.1.0-dev.1

# Bootstrap constraint: the session core and its transitive foundation
# packages (convergence kernel, universal_storage_world, mesh transport) are
# not published to pub.dev yet. The workspace resolves them through the
# `dependency_overrides` path entries in
# `plugins/ecsly_world_sync/pubspec.yaml` (`universal_storage_world`'s entry
# lives in `plugins/ecsly_world_zones/pubspec.yaml`): workspace members share
# one resolution and pub rejects the same override declared twice, so this
# package declares none of its own — exactly as it already did for the
# kernel. Remove those overrides at publish time, together; the declared
# dependencies above are the long-term contract.

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  xsoulspace_lints: ^0.1.2
