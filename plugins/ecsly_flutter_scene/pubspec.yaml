name: ecsly_flutter_scene
description: >-
  3D scene adapter for ecsly worlds on flutter_scene: declarative per-component
  visual mappings, an incremental binder that keeps a flutter_scene Scene in
  sync with world queries, and an orbit camera rig.
version: 0.1.0-dev.1
homepage: https://github.com/arenukvern/ecsly/plugins/ecsly_flutter_scene
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  ecsly: ^0.0.1-dev.12
  ecsly_flutter: ^0.1.0-dev.4
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  xsoulspace_lints: ^0.1.2
