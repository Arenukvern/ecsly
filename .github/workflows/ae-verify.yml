name: ae-verify

# Docs-vs-code honesty gate: canonical claims must hold against real code,
# with executed test evidence. See .ae_hub/canonical/ for the claims.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Install AE
        run: |
          git clone --depth 1 https://github.com/fluent-meaning-symbiotic/agentic_executables.git /tmp/ae
          dart pub global activate --source path /tmp/ae/agentic_executables_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Ingest local artifacts
        run: ae init

      - name: Sync artifact hashes
        run: ae sync

      - name: Verify artifact matrix (strict, tier 1–2)
        run: ae artifact verify --pack ecsly_workspace --strict
